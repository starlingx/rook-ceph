---
- project:
    vars:
      ensure_tox_version: '<4'
    check:
      jobs:
        - openstack-tox-linters
        - k8sapp-rook-ceph-tox-py39
        - k8sapp-rook-ceph-tox-flake8
        - k8sapp-rook-ceph-tox-pylint
        - k8sapp-rook-ceph-tox-metadata
        - k8sapp-rook-ceph-tox-bandit
    gate:
      jobs:
        - openstack-tox-linters
        - k8sapp-rook-ceph-tox-py39
        - k8sapp-rook-ceph-tox-flake8
        - k8sapp-rook-ceph-tox-pylint
        - k8sapp-rook-ceph-tox-metadata
        - k8sapp-rook-ceph-tox-bandit
    post:
      jobs:
        - stx-rook-ceph-apps-upload-git-mirror

- job:
    name: k8sapp-rook-ceph-tox-py39
    parent: openstack-tox-py39
    description: |
      Run py39 test for k8sapp_migration_rook_ceph
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/update
      - starlingx/utilities
      - starlingx/root
    files:
      -python3-k8sapp-migration-rook-ceph/*
    vars:
      python_version: 3.9
      tox_envlist: py39
      tox_extra_args: -c python3-k8sapp-migration-rook-ceph/k8sapp_migration_rook_ceph/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-rook-ceph-tox-flake8
    parent: tox
    description: |
      Run flake8 test for k8sapp_migration_rook_ceph
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/update
      - starlingx/utilities
      - starlingx/root
    files:
      -python3-k8sapp-migration-rook-ceph/*
    vars:
      tox_envlist: flake8
      tox_extra_args: -c python3-k8sapp-migration-rook-ceph/k8sapp_migration_rook_ceph/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-rook-ceph-tox-pylint
    parent: tox
    description: |
      Run pylint test for k8sapp_migration_rook_ceph
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/update
      - starlingx/utilities
      - starlingx/root
    files:
      -python3-k8sapp-migration-rook-ceph/*
    vars:
      tox_envlist: pylint
      tox_extra_args: -c python3-k8sapp-migration-rook-ceph/k8sapp_migration_rook_ceph/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-rook-ceph-tox-metadata
    parent: tox
    description: |
      Run metadata test for k8sapp_migration_rook_ceph
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/update
      - starlingx/utilities
      - starlingx/root
    files:
      -python3-k8sapp-migration-rook-ceph/*
    vars:
      tox_envlist: metadata
      tox_extra_args: -c python3-k8sapp-migration-rook-ceph/k8sapp_migration_rook_ceph/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-rook-ceph-tox-bandit
    parent: tox
    description: |
      Run bandit test for k8sapp_migration_rook_ceph
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/update
      - starlingx/utilities
      - starlingx/root
    files:
      -python3-k8sapp-migration-rook-ceph/*
    vars:
      tox_envlist: bandit
      tox_extra_args: -c python3-k8sapp-migration-rook-ceph/k8sapp_migration_rook_ceph/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: stx-rook-ceph-apps-upload-git-mirror
    parent: upload-git-mirror
    description: >
      Mirrors opendev.org/starlingx/rook-ceph to
      github.com/starlingx/rook-ceph
    vars:
      git_mirror_repository: starlingx/rook-ceph
    secrets:
      - name: git_mirror_credentials
        secret: stx-rook-ceph-apps-github-secret3
        pass-to-parent: true

