apiVersion: "helm.toolkit.fluxcd.io/v2"
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  labels:
    chart_group: starlingx-rook-charts
spec:
  releaseName: rook-ceph-cluster
  chart:
    spec:
      chart: rook-ceph-cluster
      version: 1.7.11
      sourceRef:
        kind: HelmRepository
        name: stx-platform
  interval: 5m
  timeout: 30m
  dependsOn:
    - name: rook-ceph
  test:
    enable: false
  install:
    disableHooks: false
  upgrade:
    disableHooks: false
  uninstall:
    disableHooks: false
  valuesFrom:
    - kind: Secret
      name: rook-ceph-cluster-static-overrides
      valuesKey: rook-ceph-cluster-static-overrides.yaml
    - kind: Secret
      name: rook-ceph-cluster-system-overrides
      valuesKey: rook-ceph-cluster-system-overrides.yaml
