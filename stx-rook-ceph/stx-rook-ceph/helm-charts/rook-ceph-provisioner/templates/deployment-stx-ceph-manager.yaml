{{- if .Values.global.deployment_stx_ceph_manager }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stx-ceph-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app: stx-ceph-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stx-ceph-manager
  template:
    metadata:
      labels:
        app: stx-ceph-manager
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ .Values.rbac.serviceAccount }}
      volumes:
        - name: config-key-provision
          configMap:
            name: {{ .Values.global.configmap_key_init }}
        - name: ceph-config
          emptyDir: {}
        - name: sysinv-conf
          hostPath:
            path: /etc/sysinv/sysinv.conf
      initContainers:
      - name: init
        image: {{ .Values.images.tags.k8s_entrypoint | quote }}
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
          - name: INTERFACE_NAME
            value: eth0
          - name: PATH
            value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/
          - name: DEPENDENCY_SERVICE
            value: ""
          - name: DEPENDENCY_JOBS
            value: "ceph-mgr-provision"
          - name: DEPENDENCY_DAEMONSET
            value: ""
          - name: DEPENDENCY_CONTAINER
            value: ""
          - name: DEPENDENCY_POD_JSON
            value: ""
          - name: DEPENDENCY_CUSTOM_RESOURCE
            value: ""
        command:
          - kubernetes-entrypoint
      - name: keyring
        image: {{ .Values.images.tags.ceph_config_helper | quote }}
        command: [ "/bin/bash", "/tmp/mount/provision.sh" ]
        env:
          - name: ADMIN_KEYRING
            valueFrom:
              secretKeyRef:
                name: rook-ceph-admin-keyring
                key: keyring
          - name: ROOK_MONS
            valueFrom:
              configMapKeyRef:
                name: rook-ceph-mon-endpoints
                key: data
        volumeMounts:
        - mountPath: /etc/ceph
          name: ceph-config
        - name: config-key-provision
          mountPath: /tmp/mount
      containers:
      - name: check
        image: {{ .Values.images.tags.stx_ceph_manager | quote }}
        args: ["python", "/usr/bin/ceph-manager", "--config-file=/etc/sysinv/sysinv.conf"]
        volumeMounts:
        - name: sysinv-conf
          mountPath: /etc/sysinv/sysinv.conf
          readOnly: true
        - name: ceph-config
          mountPath: /etc/ceph/
{{- end }}
